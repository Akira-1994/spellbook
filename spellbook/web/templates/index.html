<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>法術書</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body data-csrf="{{ csrf_token }}">
  <header class="masthead">
    <div class="brand-lockup">
      <span class="folio-mark">SB</span>
      <div><p class="eyebrow">A–Z SPELL COMPENDIUM</p><h1>法術書</h1></div>
    </div>
    <div class="masthead-note"><span class="status-dot">離線可用</span><span class="mono">v{{ version }}</span><button id="quit-button" class="quit-button" type="button">結束程式</button></div>
  </header>

  <div id="offline-banner" class="offline-banner" role="alert" hidden>法術書程式已經關閉。請重新開啟 Spellbook.exe，再重新整理這個頁面。</div>

  <main class="workspace" aria-label="法術書">
    <aside class="index-pane" aria-label="法術索引">
      <label class="search-box"><span class="sr-only">搜尋法術</span><input id="search" type="search" placeholder="搜尋中英文名稱或內文…" autocomplete="off"><kbd>/</kbd></label>
      <details id="filters" class="filters" open>
        <summary><span>篩選</span><span id="filter-count" class="filter-count" hidden></span></summary>
        <div class="filter-group">
          <p class="filter-label">學派</p>
          <div id="school-filters" class="school-filters" role="group" aria-label="學派篩選"></div>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="class-filter">職業／領域</label>
          <select id="class-filter"><option value="">全部職業與領域</option></select>
        </div>
        <div class="filter-group">
          <p class="filter-label">等級</p>
          <div id="level-filters" class="level-filters" role="group" aria-label="等級篩選"></div>
        </div>
        <div class="filter-actions">
          <label class="toggle"><input id="edited-only" type="checkbox"><span>只看我修改過的</span></label>
          <button id="clear-filters" class="text-button" type="button" hidden>清除篩選</button>
        </div>
      </details>
      <p id="summary" class="summary" aria-live="polite"></p>
      <nav id="alphabet" class="alphabet" aria-label="字母篩選"></nav>
      <div id="spell-list" class="spell-list" role="listbox" aria-label="法術清單"></div>
    </aside>

    <section class="page-pane" aria-label="法術內容">
      <div id="empty-state" class="empty-state"><span>✦</span><h2>從左側選一個法術</h2><p>可以用名稱或內文搜尋，也能依字母瀏覽。</p></div>

      <article id="spell-view" class="spell-view" hidden>
        <header class="spell-header">
          <div>
            <div id="view-schools" class="school-line"></div>
            <h2 id="view-name-zh"></h2>
            <p id="view-name-en" class="english-title"></p>
          </div>
          <button id="edit-button" class="secondary" type="button">編輯</button>
        </header>
        <div id="view-badges" class="badges"></div>
        <dl id="view-stats" class="stat-block"></dl>
        <div id="view-taxonomy" class="taxonomy"></div>
        <section class="prose" aria-label="法術說明"><div id="view-description"></div></section>
        <details id="view-english" class="english-block" hidden><summary>英文原文</summary><div id="view-description-en"></div></details>
      </article>

      <form id="spell-form" class="spell-form" hidden>
        <p class="eyebrow">編輯中</p>
        <fieldset class="field-section"><legend>名稱</legend>
          <div class="two-col"><label>中文名稱<input name="name_zh" required></label><label>英文名稱<input name="name_en" required></label></div>
        </fieldset>
        <fieldset class="field-section"><legend>規則</legend>
          <div class="rule-grid">
            <label>學派<input name="school"></label><label>子學派<input name="subschool"></label>
            <label class="wide">成分<input name="components"></label><label>施法時間<input name="casting_time"></label>
            <label>距離<input name="range_text"></label><label class="wide">目標<input name="target_text"></label>
            <label>區域<input name="area_text"></label><label>效果<input name="effect_text"></label>
            <label>持續時間<input name="duration"></label><label>豁免<input name="saving_throw"></label>
            <label>法術抗力<input name="spell_resistance"></label><label>額外代價<input name="additional_costs"></label>
          </div>
        </fieldset>
        <fieldset class="field-section"><legend>說明</legend>
          <label>中文說明<textarea name="description_zh" rows="14"></textarea></label>
          <label>英文原文<textarea name="description_en" rows="6"></textarea></label>
        </fieldset>
        <div class="action-bar">
          <span id="form-state" class="form-state"></span>
          <button id="cancel-button" class="secondary" type="button">取消</button>
          <button id="save-button" class="primary" type="submit">儲存</button>
        </div>
      </form>
    </section>

    <aside class="history-pane" aria-label="版本紀錄">
      <div class="pane-heading"><h2>版本紀錄</h2><p>每個法術保留最近 {{ max_versions }} 個版本</p></div>
      <div id="history" class="history"><p class="muted">選取法術後顯示。</p></div>
      <div class="history-footer">
        <button id="restore-original" class="text-danger" type="button" disabled>還原成原始內容</button>
        <p class="muted">原始內容永遠保留，不佔版本名額。</p>
      </div>
    </aside>
  </main>

  <dialog id="confirm-dialog">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="dialog-actions"><button type="button" value="cancel" class="secondary">取消</button><button type="button" value="ok" class="primary">確定</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', path='/app.js') }}"></script>
</body>
</html>
