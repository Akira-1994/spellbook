[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spellbook-reviewer"
version = "0.1.0"
description = "Offline local review workspace for the Spellbook A-Z database"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "python-multipart>=0.0.12,<1",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
spellbook-reviewer = "spellbook_reviewer.launcher:main"

[tool.setuptools.packages.find]
include = ["spellbook_reviewer*"]

[tool.setuptools.package-data]
spellbook_reviewer = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

