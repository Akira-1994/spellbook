[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spellbook"
version = "0.3.3"
description = "Offline personal spellbook for browsing and editing A-Z spells"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "openpyxl>=3.1,<4",
  "pillow>=10,<13",
  "pyinstaller>=6.11,<7",
  "pypdf>=4,<7",
]

[project.scripts]
spellbook = "spellbook.launcher:main"

[tool.setuptools.packages.find]
include = ["spellbook*"]

[tool.setuptools.package-data]
spellbook = ["seed_fixes.json", "taxonomy.json", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

